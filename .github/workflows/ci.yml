name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # meridian-seedatlas compiles the Seed Atlas engine (C11), which needs a
      # GNU or LLVM C compiler: on Windows MinGW, as Horizon's launcher uses.
      - name: Set up MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW on the PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin' >> "$GITHUB_PATH"
      - name: Install Rust 1.95 (Horizon's minimum)
        shell: bash
        run: |
          toolchain=1.95.0
          # the target Horizon builds Windows for
          if [ "$RUNNER_OS" = Windows ]; then toolchain=1.95.0-x86_64-pc-windows-gnu; fi
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup default $toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Registry identities match the mod lock
        if: runner.os == 'Linux'
        run: python3 tools/check_lock.py
      - name: The engine copy matches its Seed Atlas commit
        if: runner.os == 'Linux'
        run: tools/vendor-seedatlas.sh --check

  adapter:
    name: Fork API and package
    runs-on: ubuntu-latest
    # Full native callback and in-game checks need the owner's prepared game.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: tools/check-adapter.sh --all-targets
      - name: Install the pinned fork package tool
        run: cargo install --locked --git https://github.com/arismoko/horizon --rev afe471cf15df56439f23cd991d0d4b85563a14fc cargo-horizon-mod
      - name: Pack and validate the .hmod
        run: tools/pack-hmod.sh
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-hmod
          path: target/meridian-*.hmod
