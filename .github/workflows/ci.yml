name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # meridian-seedatlas compiles the Seed Atlas engine (C11), which needs a
      # GNU or LLVM C compiler: on Windows MinGW, as Horizon's launcher uses.
      - name: Set up MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Put MinGW on the PATH
        if: runner.os == 'Windows'
        shell: bash
        run: echo '${{ steps.msys2.outputs.msys2-location }}\mingw64\bin' >> "$GITHUB_PATH"
      - name: Install Rust 1.95 (Horizon's minimum)
        shell: bash
        run: |
          toolchain=1.95.0
          # the target Horizon builds Windows for
          if [ "$RUNNER_OS" = Windows ]; then toolchain=1.95.0-x86_64-pc-windows-gnu; fi
          rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy
          rustup default $toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Lockfile only uses crates Horizon locks
        if: runner.os == 'Linux'
        run: python3 tools/check_lock.py
      - name: The engine copy matches its Seed Atlas commit
        if: runner.os == 'Linux'
        run: tools/vendor-seedatlas.sh --check

  adapter:
    name: Horizon adapter (pinned Nightly)
    runs-on: ubuntu-latest
    # The adapter compiles the whole game client: run it on main and by hand only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: tools/check-adapter.sh
