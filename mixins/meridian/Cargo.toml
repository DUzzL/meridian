[package]
name = "meridian-horizon"
description = "Meridian's adapter to Horizon's native mod API"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
# The SDK of the build pinned in horizon-mod.toml; `cargo horizon-mod` fetches
# it into .horizon/sdk/ (never committed or packed). Registry dependencies are
# pinned in this bundle's Cargo.lock and may not alter the SDK's graph.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
meridian-core = { path = "src/core" }
meridian-host = { path = "src/host" }
meridian-seedatlas = { path = "src/seedatlas" }
png = "=0.18.1"
log = "=0.4.34"
parking_lot = "=0.12.5"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
