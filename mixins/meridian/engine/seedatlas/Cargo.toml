# Self-contained (no workspace inheritance): the Horizon launcher builds this
# crate from the bundle, where the repository's workspace does not exist.
[package]
name = "meridian-seedatlas"
description = "Seed Atlas for Meridian: biomes and structures from a world seed (a Rust port of the Seed Atlas engine, derived from cubiomes)"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
flate2 = "=1.1.10"
