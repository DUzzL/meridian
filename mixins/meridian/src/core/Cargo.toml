# Self-contained (no workspace inheritance): the Horizon launcher builds this
# crate from the bundle, where the repository's workspace does not exist.
# Versions are exact matches of Horizon's Cargo.lock.
[package]
name = "meridian-core"
description = "Meridian's map engine: data model, colours, region cache, settings and storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
meridian-host = { path = "../host" }
meridian-seedatlas = { path = "../seedatlas" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
flate2 = "=1.1.10"
parking_lot = "=0.12.5"
log = "=0.4.34"
thiserror = "=2.0.21"
png = "=0.18.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
