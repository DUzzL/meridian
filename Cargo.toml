[workspace]
resolver = "3"
members = [
    "mixins/meridian/src/host",
    "mixins/meridian/src/core",
    "mixins/meridian/src/seedatlas",
]
# The fork adapter uses the pinned mod SDK and is checked separately by
# tools/check-adapter.sh; the launcher also compiles its native callbacks.
exclude = ["mixins/meridian"]

# The crates under mixins/ are self-contained on purpose (the launcher builds
# them from the bundle, without this file): set versions, dependencies and
# lints in each crate's own Cargo.toml.
